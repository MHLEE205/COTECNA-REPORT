<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;font-size:13px;}
.api-mini{display:flex;align-items:center;gap:8px;}
.api-mini input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;width:220px;font-size:12px;font-family:monospace;}
.api-mini input:focus{outline:none;border-color:var(--accent);}
.api-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);}.api-dot.ok{background:var(--ok);}
.main{max-width:960px;margin:0 auto;padding:20px 16px;}
.steps{display:flex;flex-direction:column;gap:12px;}
.step{background:var(--read);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s;}
.step.active{border-color:var(--accent);}.step.done{border-color:var(--ok);opacity:.92;}
.step-hdr{display:flex;align-items:center;gap:10px;padding:12px 18px;cursor:pointer;user-select:none;}
.step-hdr:hover{background:rgba(79,142,247,.03);}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;color:var(--text2);}
.step.active .step-num{background:var(--accent);color:#fff;}.step.done .step-num{background:var(--ok);color:#fff;}
.step-title{font-weight:600;font-size:13px;}.step-sub{color:var(--text2);font-size:11px;margin-left:auto;}
.step-body{padding:16px 18px;display:none;}
.step.active .step-body,.step.open .step-body{display:block;}
.folder-banner{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s;margin-bottom:8px;}
.folder-banner:hover{border-color:var(--accent);}.folder-banner.ok{border-color:var(--ok);}
.folder-path{font-size:12px;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.folder-path b{color:var(--text);}
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;}
.filter-bar label{font-size:11px;color:var(--text2);}
.filter-bar input[type=date]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:6px;font-size:12px;font-family:inherit;outline:none;}
.filter-bar input[type=date]:focus{border-color:var(--accent);}
.btn{padding:7px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
.btn-primary{background:var(--accent-btn);color:#fff;}.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled,.btn-ok:disabled{background:var(--border);color:var(--text3);cursor:not-allowed;}
.btn-ok{background:var(--ok);color:#fff;}.btn-ok:hover{filter:brightness(1.1);}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm{padding:4px 10px;font-size:11px;}.btn-full{width:100%;justify-content:center;}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(79,142,247,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
.login-row{display:flex;align-items:center;gap:10px;}
.login-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;}.login-dot.ok{background:var(--ok);}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.section-hdr .count{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.dash-table{width:100%;border-collapse:collapse;font-size:12px;}
.dash-table th{background:var(--frame);color:var(--text);padding:7px 10px;text-align:left;font-weight:700;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;}
.dash-table td{padding:7px 10px;border-bottom:1px solid rgba(46,51,80,.4);vertical-align:middle;}
.dash-table tr:hover td{background:rgba(79,142,247,.04);}
.iv-link{color:var(--accent);font-weight:700;cursor:pointer;}.iv-link:hover{text-decoration:underline;}
.sbadge{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:10px;font-size:10px;font-weight:700;}
.sbadge-other{background:rgba(79,142,247,.15);color:var(--accent);}
.date-range{font-size:11px;color:var(--text2);line-height:1.5;}
.log-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;max-height:200px;overflow-y:auto;font-size:11px;font-family:'Consolas',monospace;line-height:1.7;}
.log-ok{color:var(--ok);}.log-err{color:var(--error);}.log-info{color:var(--info);}.log-warn{color:var(--warn);}
.progress-bar{height:3px;background:var(--border);border-radius:2px;margin:8px 0;}
.progress-bar .fill{height:100%;border-radius:2px;background:var(--accent);transition:width .4s;}
.progress-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:6px;}
.phase-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.phase-chip{padding:2px 10px;border-radius:10px;border:1px solid var(--border);color:var(--text3);background:var(--surface2);font-size:11px;font-weight:600;transition:all .2s;}
.phase-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(79,142,247,.08);animation:pulse .8s infinite alternate;}
.phase-chip.done{border-color:var(--ok);color:var(--ok);}
@keyframes pulse{from{opacity:.7}to{opacity:1}}
.job-card{background:var(--surface2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 14px;margin-bottom:10px;}
.job-card-title{font-weight:700;font-size:13px;color:var(--accent);}
.job-card-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.class-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;}
.class-slot{background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden;text-align:center;}
.class-slot img{width:100%;height:60px;object-fit:cover;display:block;}
.class-slot .slot-name{font-size:9px;padding:2px;color:var(--text3);font-weight:600;}
.class-slot.slot-ok{border-color:var(--ok);}.class-slot.slot-ok .slot-name{color:var(--ok);}
.slot-empty{height:60px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:11px;}
.result-card{background:var(--surface2);border:1px solid var(--ok);border-radius:10px;padding:16px;margin-top:12px;}
.result-title{font-weight:700;font-size:13px;color:var(--ok);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.dl-row{display:flex;gap:8px;flex-wrap:wrap;}
.dl-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;text-decoration:none;color:var(--text);transition:all .15s;font-size:12px;}
.dl-btn:hover{border-color:var(--ok);}
.dl-name{font-weight:700;display:block;}.dl-size{color:var(--text2);font-size:10px;}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:11px;}
.chip-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}
.hint{color:var(--text2);font-size:11px;margin-top:4px;}
@media(max-width:600px){.class-grid{grid-template-columns:repeat(3,1fr);}.dl-row{flex-direction:column;}.api-mini{display:none;}}


/* ── v15.0 ── */
.key-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.key-row input{background:var(--read);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;width:240px;font-size:12px;font-family:Consolas,monospace;}
.job{background:var(--read);border:1px solid var(--border);border-radius:10px;margin-top:12px;overflow:hidden;}
.job.ok{border-color:var(--ok);}.job.ng{border-color:var(--error);}
.job-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--frame);flex-wrap:wrap;}
.job-hdr b{font-size:13px;}
.job-sub{font-size:11px;color:var(--text2);}
.job-state{margin-left:auto;font-size:12px;font-weight:700;}
.job-state.ok{color:var(--ok);}.job-state.ng{color:var(--error);}.job-state.run{color:var(--info);}
.job-body{padding:10px 14px;}
.issues{margin:6px 0 10px;padding:0;list-style:none;font-size:12px;}
.issues li{padding:4px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.issues li.red{color:var(--error);}.issues li.yellow{color:var(--warn);}
.issues li.done{color:var(--text2);text-decoration:line-through;}
.ct-block{margin-top:10px;}
.ct-title{font-size:12px;font-weight:700;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ct-title small{font-weight:400;color:var(--text2);}
.slot-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
.slot{border:2px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface2);cursor:pointer;position:relative;}
.slot.ok{border-color:var(--ok);}.slot.red{border-color:var(--error);}.slot.yellow{border-color:var(--warn);}
.slot img{width:100%;height:84px;object-fit:cover;display:block;}
.slot .cap{font-size:10px;padding:3px 4px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot .none{height:84px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--error);}
.pair-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;}
.pair{border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface2);}
.pair .imgs{display:grid;grid-template-columns:1fr 1fr;}
.pair img{width:100%;height:70px;object-fit:cover;display:block;}
.pair .cap{font-size:10px;padding:2px 4px;color:var(--text2);}
.picker{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:900;}
.picker.on{display:flex;}
.picker-box{background:var(--read);border:1px solid var(--border);border-radius:10px;max-width:900px;width:92vw;max-height:84vh;overflow:auto;padding:14px;}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px;}
.picker-grid div{border:2px solid var(--border);border-radius:6px;overflow:hidden;cursor:pointer;}
.picker-grid div:hover,.picker-grid div:focus{border-color:var(--accent);outline:none;}
.picker-grid img{width:100%;height:100px;object-fit:cover;display:block;}
.picker-grid span{display:block;font-size:10px;padding:2px 4px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inp{background:var(--read);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:12px;}
@media(max-width:700px){.slot-grid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>
<div id="app" style="display:none">
<!-- ln-header は LEENAI が挿入 -->
<div class="main">
<div class="steps">

  <div class="step active open" id="step1">
    <div class="step-hdr" onclick="toggleStep('step1')">
      <div class="step-num">1</div>
      <div class="step-title">自主検査リスト</div>
      <div class="step-sub" id="step1Sub">検査日を選んで照会</div>
    </div>
    <div class="step-body">
      <div class="key-row">
        <span class="api-dot" id="apiDot"></span>
        <label for="apiKey" style="font-size:11px;color:var(--text2);">AI キー</label>
        <input type="password" id="apiKey" placeholder="sk-ant-..." maxlength="200" autocomplete="off">
        <button class="btn btn-ghost btn-sm" onclick="saveApiKey()">保存</button>
        <span class="hint" style="margin:0;">この PC のブラウザにだけ保存します</span>
      </div>
      <div class="filter-bar">
        <label for="dateFrom">検査日</label>
        <input type="date" id="dateFrom">
        <span style="color:var(--text3);">〜</span>
        <input type="date" id="dateTo">
        <button class="btn btn-primary btn-sm" id="fetchBtn" onclick="fetchList()">リスト照会</button>
      </div>
      <div id="fetchLog" class="log-box mt8" style="display:none;max-height:140px;"></div>
      <div id="listArea" style="display:none;" class="mt12">
        <div class="section-hdr">
          <span class="count" id="listCount"></span>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-ghost btn-sm" onclick="selectAll(true)">全選択</button>
            <button class="btn btn-ghost btn-sm" onclick="selectAll(false)">全解除</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="dash-table">
            <thead><tr>
              <th style="width:28px;"></th>
              <th>検査日</th>
              <th>Invoice No</th>
              <th>VO No</th>
              <th>Partial</th>
              <th>圧縮場</th>
              <th>PORT</th>
              <th>CT</th>
              <th>写真</th>
            </tr></thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div class="mt8">
          <button class="btn btn-ok btn-full" id="proceedBtn" onclick="proceedSelected()" disabled style="padding:10px;">選択した件のレポートを作成</button>
        </div>
      </div>
    </div>
  </div>

  <div class="step" id="step2">
    <div class="step-hdr" onclick="toggleStep('step2')">
      <div class="step-num">2</div>
      <div class="step-title">自動作成</div>
      <div class="step-sub" id="step2Sub">検査書類を読む → 写真を分類 → 番号を照合 → レポート</div>
    </div>
    <div class="step-body">
      <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%;"></div></div>
      <div class="progress-lbl"><span id="progressLabel">待機中</span><span id="progressPct">0%</span></div>
      <div id="jobs"></div>
      <details class="mt8"><summary style="font-size:11px;color:var(--text2);cursor:pointer;">処理の記録</summary>
        <div class="log-box mt8" id="logBox"></div>
      </details>
    </div>
  </div>

</div>
</div><!-- /main -->
<!-- ln-footer は LEENAI が挿入 -->
</div><!-- /app -->

<div class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="picker-box">
    <div style="display:flex;align-items:center;gap:10px;">
      <b id="pickerTitle">写真を選ぶ</b>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="closePicker()">閉じる</button>
    </div>
    <div class="picker-grid" id="pickerGrid"></div>
  </div>
</div>

<script>
/* ✦ Powered by LEENAI Automation System — C-02 COTECNA レポート v15.3 (2026-11-21)
   v15.1: VAN 写真をセル幅に収める (1 ページ 6 枚) · BALING の日付 = その組を検査した CT の作業日 (CHECK LIST の Checked 順)
   v15.3: COMPASS でコンテナ番号が未入力の CT を CT として扱わない (空の番号が _書類 フォルダに当たっていた) · 写真フォルダは CT 番号の形 (英字4+数字7) のものだけ
   v15.2: Word の段落既定 (後 8pt · 1.08 行) で VAN が 1 ページ 4 枚になる問題 → 文書の段落既定を前後 0 · 1 行に固定
   v15.0: 写真 = SharePoint PHOTO_V2 を Graph で読む (フォルダ選択・業者別分岐・ファイル名規則を廃止)。
          CT 番号 = COMPASS (形님 決定 D1)。CT の順番 = COTECNA 検査書類 (CHECK LIST) の順 (D2)。
          開梱/再梱包の組 = 検査書類の検査数ちょうど (D3)・同じ grade どうし (D4)。
          圧縮機の中に古紙が散らばる写真も open_bale (D5)。日付の無い写真には検査日を入れる (D6)。
          写真分類 = Opus を TOOL の中で (D9・D11)。番号照合 (seal・コンテナ番号・検査番号の紙) で人の確認を赤だけに (D10)。
          写真の場所 = _COTECNA/{CT} → 無ければ {IV}/{CT} (D15)。今回は VAN・BALING レポートだけ (D16)。
          共通ファイル (LEENAI_COMMON) は変更しない (D12)。
   v14.1 以前の判断知識 (6枠の基準・seal の 2 次判定・right_door の段階判定・BALING 判断順・ベール番号の組) は
   AI への指示文と照合ルールに移した。 */

const MODEL='claude-opus-5-5';
const AI_MAX_SIDE=1024;          /* AI に送る写真の長辺 (費用・速度のため縮小。レポートには原本) */
const BALING_CHUNK=40;           /* BALING 写真を 1 回の AI 呼び出しで送る上限 */
/* COTECNA seal 記録 (このツール専用の記録ファイル · ドライブは LEENAI_COMMON の値を使う) */
const SEAL_JSON_PATH='古紙/-. AI 活用/C-02-COTECNA/cotecna_seal_master.json';
const SLOT_ORDER=['empty','half','full','right_door','inspector','cotecna_seal'];
const SLOT_CAPTIONS={empty:'Empty container',half:'Half load container',full:'Full load container',right_door:'Right door closed, with Container No.',inspector:'Inspector with closed container',cotecna_seal:'Cotecna container seal, closed up'};
const SLOT_JA={empty:'空',half:'半積',full:'満載',right_door:'右扉',inspector:'検査員',cotecna_seal:'COTECNA シール'};
/* v15.1: 写真の幅をセルの中 (5316 − 余白 216 = 5100 dxa) に収める。v15.0 まではセルより 0.18cm 広く、
   右端 (日付) が切れる · Word では列が広がって 1 ページに 6 枚収まらない原因 (形님 指摘 2026-11-21) */
const IMG_CX=3200400,IMG_CY=2400300;
const GRAPH_BASE='https://graph.microsoft.com/v1.0/';
const IMG_RE=/\.(jpe?g|png)$/i;

const S={apiKey:'',inspList:[],selectedKeys:[],jobs:{},docCache:{},plantCache:{},sealMaster:null,
  /* 下は docx 作成時だけ使う (v14.1 の作成関数をそのまま使うため) */
  containers:[],classifiedVan:{},classifiedBaling:{},voNo:'',reportDate:'',inspLocation:''};

/* ── 共通の値 (LEENAI_COMMON v1.13 · ここには書かない) ── */
function dvApi(){return (window.LEENAI&&LEENAI.DV_URL)?LEENAI.DV_URL+'/api/data/v9.2':'';}
function photoRoot(){return (window.LEENAI&&LEENAI.SP&&LEENAI.SP.PATH&&LEENAI.SP.PATH.PHOTO_V2)||'';}
function driveId(){return (window.LEENAI&&LEENAI.SP&&LEENAI.SP.DRIVE_ID)||'';}
function commonMissing(){
  const m=[];
  if(!dvApi())m.push('LEENAI.DV_URL');
  if(!photoRoot())m.push('LEENAI.SP.PATH.PHOTO_V2');
  if(!driveId())m.push('LEENAI.SP.DRIVE_ID');
  return m;
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleStep(id){const el=document.getElementById(id);if(!el)return;el.classList.toggle('open');}
function log(msg,type){const box=document.getElementById('logBox');if(!box)return;const d=document.createElement('div');if(type)d.className='log-'+type;d.textContent=msg;box.appendChild(d);box.scrollTop=box.scrollHeight;}
function flog(msg,type){const box=document.getElementById('fetchLog');if(!box)return;box.style.display='block';const d=document.createElement('div');if(type)d.className='log-'+type;d.textContent=msg;box.appendChild(d);box.scrollTop=box.scrollHeight;}
function setProgress(pct,label){
  const f=document.getElementById('progressFill'),l=document.getElementById('progressLabel'),p=document.getElementById('progressPct');
  if(f)f.style.width=pct+'%';if(l)l.textContent=label;if(p)p.textContent=pct+'%';
}

/* ── COMPASS ── */
async function dvGet(url){
  const tok=await LEENAI.auth.token('dataverse');
  const r=await fetch(url,{headers:{Authorization:'Bearer '+tok,'OData-MaxVersion':'4.0','OData-Version':'4.0',Accept:'application/json;odata.metadata=minimal'}});
  if(!r.ok)throw new Error('COMPASS '+r.status+': '+(await r.text()).slice(0,120));
  return r.json();
}

/* ── SharePoint (Graph) ── */
function spEnc(p){return p.split('/').map(encodeURIComponent).join('/');}
async function grFetch(url,opt,retried){
  const tok=await LEENAI.auth.token('graph');
  if(!tok)throw new Error('Graph トークンがありません (再ログインしてください)');
  const o=Object.assign({cache:'no-store'},opt||{});
  o.headers=Object.assign({Authorization:'Bearer '+tok},(opt&&opt.headers)||{});
  const r=await fetch(url,o);
  if(r.status===401&&!retried)return grFetch(url,opt,true);
  return r;
}
function grPathUrl(path){return GRAPH_BASE+'drives/'+driveId()+'/root:/'+spEnc(path)+':';}
async function grJsonPath(path){
  const r=await grFetch(grPathUrl(path)+'/content');
  if(r.status===404)return null;
  if(!r.ok)throw new Error(path+' → '+r.status);
  return r.json();
}
async function grChildren(url){
  const out=[];
  while(url){
    const r=await grFetch(url);
    if(r.status===404)return null;
    if(!r.ok)throw new Error('一覧の取得に失敗 ('+r.status+')');
    const d=await r.json();
    (d.value||[]).forEach(x=>out.push(x));
    url=d['@odata.nextLink']||null;
  }
  return out;
}
function grList(path){return grChildren(grPathUrl(path)+'/children?$expand=thumbnails&$top=200');}
function grListItem(id){return grChildren(GRAPH_BASE+'drives/'+driveId()+'/items/'+id+'/children?$expand=thumbnails&$top=200');}
async function grBlob(id){
  const r=await grFetch(GRAPH_BASE+'drives/'+driveId()+'/items/'+id+'/content');
  if(!r.ok)throw new Error('ファイルの取得に失敗 ('+r.status+')');
  return r.blob();
}
async function grPutJson(path,data){
  const r=await grFetch(grPathUrl(path)+'/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data,null,2)});
  if(!r.ok)throw new Error('SharePoint 保存 '+r.status);
  return r.json();
}
function thumbUrl(it){const t=it&&it.thumbnails&&it.thumbnails[0];return t?(t.medium||t.large||t.small||{}).url||'':'';}

/* ── STEP 1: 自主検査リスト (v14.1 の照会をそのまま · 写真の有無は PHOTO_V2 で確認) ── */
async function fetchList(){
  if(LEENAI.auth.status.dataverse!=='ok'){alert('COMPASS にログインしてください');return;}
  const dateFrom=document.getElementById('dateFrom').value,dateTo=document.getElementById('dateTo').value;
  if(!dateFrom||!dateTo){alert('検査日を入れてください');return;}
  const DV=dvApi();
  document.getElementById('fetchLog').innerHTML='';
  document.getElementById('listArea').style.display='none';
  const btn=document.getElementById('fetchBtn');btn.disabled=true;btn.textContent='照会中...';
  S.inspList=[];
  try{
    flog('COMPASS 自主検査コンテナを照会中...','info');
    const filter=`crcf9_inspection eq true and crcf9_work_date ge ${dateFrom}T00:00:00Z and crcf9_work_date le ${dateTo}T23:59:59Z`;
    const ctData=await dvGet(`${DV}/crcf9_container_informations?$filter=${encodeURIComponent(filter)}&$select=crcf9_container_informationid,crcf9_container_no,crcf9_partial_no,crcf9_work_date,crcf9_seal_no,_crcf9_booking_id_value,_crcf9_purchase_contract_id_value,_crcf9_parker_plant_id_value&$orderby=crcf9_work_date asc&$top=500`);
    if(!ctData.value||!ctData.value.length){flog('指定期間に自主検査の対象がありません','warn');renderTable();return;}
    flog(`CT ${ctData.value.length} 件`,'info');
    const uniq=a=>[...new Set(a.filter(Boolean))];
    const bkgMap={},pcMap={},packerMap={},scMap={},siVoMap={},polMap={},plantMap={};
    await Promise.all(uniq(ctData.value.map(c=>c._crcf9_booking_id_value)).map(async g=>{
      try{bkgMap[g]=await dvGet(`${DV}/cr49f_bookings(${g})?$select=cr49f_bookingid,cr49f_invoice_no,cr49f_booking_no,_cr49f_region_japan_id_value,_cr49f_sale_contract_id_value`);}catch(e){flog('BKG '+g.slice(0,8)+': '+e.message.slice(0,60),'warn');}
    }));
    await Promise.all(uniq(ctData.value.map(c=>c._crcf9_purchase_contract_id_value)).map(async g=>{
      try{pcMap[g]=await dvGet(`${DV}/cr49f_purchase_contracts(${g})?$select=cr49f_purchase_contractid,_cr49f_packer_id_value`);}catch(e){}
    }));
    await Promise.all(uniq(Object.values(pcMap).map(p=>p._cr49f_packer_id_value)).map(async g=>{
      try{packerMap[g]=await dvGet(`${DV}/cr49f_packers(${g})?$select=cr49f_packer,cr49f_packer_name`);}catch(e){}
    }));
    const scIds=uniq(Object.values(bkgMap).map(b=>b._cr49f_sale_contract_id_value));
    await Promise.all(scIds.map(async g=>{
      try{scMap[g]=await dvGet(`${DV}/cr49f_sale_contracts(${g})?$select=cr49f_sale_contract_id,cr49f_sale_contract_no`);}catch(e){}
      try{const d=await dvGet(`${DV}/cr49f_s_is?$filter=_cr49f_sale_contract_id_value eq ${g}&$select=crcf9_vo_no&$top=1`);if(d.value&&d.value.length&&d.value[0].crcf9_vo_no)siVoMap[g]=d.value[0].crcf9_vo_no;}catch(e){}
    }));
    await Promise.all(uniq(Object.values(bkgMap).map(b=>b._cr49f_region_japan_id_value)).map(async g=>{
      try{const d=await dvGet(`${DV}/crcf9_region_japans(${g})?$select=crcf9_pol,crcf9_region_japan`);polMap[g]=d.crcf9_pol||d.crcf9_region_japan||'—';}catch(e){}
    }));
    await Promise.all(uniq(ctData.value.map(c=>c._crcf9_parker_plant_id_value)).map(async g=>{
      try{const d=await dvGet(`${DV}/crcf9_packer_plants(${g})?$select=crcf9_plant`);plantMap[g]=d.crcf9_plant||'';}catch(e){}
    }));
    const groupMap={};
    const addCt=(ct,bkg,bkgGuid)=>{
      const ivNo=bkg.cr49f_invoice_no||bkgGuid,partial=ct.crcf9_partial_no||'';
      const key=ivNo+'::'+partial;
      if(!groupMap[key]){
        const scId=bkg._cr49f_sale_contract_id_value,sc=scMap[scId]||{};
        const rawVo=(siVoMap[scId]||sc.cr49f_sale_contract_no||'').replace(/^VO\s*NO\.?\s*/i,'').trim();
        const vm=rawVo.match(/X\.(\d+\.\d+)/i);
        const pc=pcMap[ct._crcf9_purchase_contract_id_value]||{},pk=packerMap[pc._cr49f_packer_id_value];
        const plantGuid=ct._crcf9_parker_plant_id_value||'';
        groupMap[key]={groupKey:key,ivNo,voNo:vm?'X.'+vm[1]:(rawVo||''),partial:partial||'',bkgNo:bkg.cr49f_booking_no||'—',bkgGuid,
          packer:(pk&&(pk.cr49f_packer||pk.cr49f_packer_name))||'—',pol:polMap[bkg._cr49f_region_japan_id_value]||'—',
          plantGuid,plantJa:plantMap[plantGuid]||'',workDates:[],ctList:[],noCtIds:[],photoStatus:'…'};
      }
      const g=groupMap[key];
      /* v15.3: コンテナ番号を正規化してから重複判定 · 番号が未入力の CT はレポートに入れず数だけ数える */
      const ctNoN=(ct.crcf9_container_no||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!ctNoN){const id=ct.crcf9_container_informationid||('?'+g.noCtIds.length);if(!g.noCtIds.includes(id))g.noCtIds.push(id);return false;}
      if(g.ctList.some(c=>c.ctNo===ctNoN))return false;
      const d=(ct.crcf9_work_date||'').slice(0,10);
      if(d&&!g.workDates.includes(d))g.workDates.push(d);
      g.ctList.push({ctNo:ctNoN,date:d});
      return true;
    };
    for(const ct of ctData.value){const g=ct._crcf9_booking_id_value,b=bkgMap[g];if(b)addCt(ct,b,g);}
    /* 期間外の同じ BKG・同じ Partial の CT も補う (v14.1 と同じ) */
    let added=0;
    await Promise.all(uniq(Object.values(groupMap).map(g=>g.bkgGuid)).map(async bkgId=>{
      try{
        const all=await dvGet(`${DV}/crcf9_container_informations?$filter=${encodeURIComponent('crcf9_inspection eq true and _crcf9_booking_id_value eq '+bkgId)}&$select=crcf9_container_informationid,crcf9_container_no,crcf9_partial_no,crcf9_work_date,_crcf9_purchase_contract_id_value,_crcf9_parker_plant_id_value&$top=200`);
        const b=bkgMap[bkgId];if(!b)return;
        for(const ct of (all.value||[])){
          const key=(b.cr49f_invoice_no||bkgId)+'::'+(ct.crcf9_partial_no||'');
          if(groupMap[key]&&addCt(ct,b,bkgId))added++;
        }
      }catch(e){flog('BKG 補完 '+bkgId.slice(0,8)+': '+e.message.slice(0,60),'warn');}
    }));
    if(added)flog(`期間外の CT ${added} 件を補完`,'info');
    const list=Object.values(groupMap);
    list.forEach(r=>r.workDates.sort());
    list.sort((a,b)=>(a.workDates[0]||'').localeCompare(b.workDates[0]||'')||a.ivNo.localeCompare(b.ivNo)||a.partial.localeCompare(b.partial));
    S.inspList=list;renderTable();
    flog(`${list.length} 件 (IV × Partial)`,'ok');
    /* 写真の有無 (PHOTO_V2/{IV} があるか) */
    for(const iv of uniq(list.map(r=>r.ivNo))){
      let st='—';
      try{const ch=await grList(photoRoot()+'/'+iv);st=ch?(ch.some(x=>x.name==='_COTECNA')?'✅':'△'):'❌';}catch(e){st='?';}
      list.filter(r=>r.ivNo===iv).forEach(r=>r.photoStatus=st);
      renderTable();
    }
  }catch(e){flog('照会エラー: '+e.message,'err');}
  finally{btn.disabled=false;btn.textContent='リスト照会';}
}

/* ══════════ 写真 (読込・縮小・日付) ══════════ */
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('読込失敗'));r.readAsDataURL(blob);});}
function b64Img(b64){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('画像を開けません'));i.src='data:image/jpeg;base64,'+b64;});}
/* AI 用に縮小 (長辺 AI_MAX_SIDE) */
async function shrinkB64(b64){
  const img=await b64Img(b64);
  const k=Math.min(1,AI_MAX_SIDE/Math.max(img.width||1,img.height||1));
  if(k>=1)return b64;
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.85).split(',')[1];
}
/* 日付の無い写真に検査日を入れる (右下 · v14.1 と同じ見た目 · D6) */
async function stampDate(b64,dateStr){
  const img=await b64Img(b64);
  const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
  const fs=Math.max(14,Math.round(img.height*0.035));
  ctx.font='bold '+fs+'px Arial, sans-serif';
  const pad=Math.round(fs*0.5),tw=ctx.measureText(dateStr).width,x=img.width-tw-pad*2,y=img.height-pad;
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(x-pad/2,y-fs-pad/2,tw+pad,fs+pad);
  ctx.fillStyle='#ffffff';ctx.fillText(dateStr,x,y);
  return c.toDataURL('image/jpeg',0.92).split(',')[1];
}
async function loadPhoto(p){
  if(p.b64)return p;
  const blob=await grBlob(p.id);
  p.b64=await blobToB64(blob);
  p.ai=await shrinkB64(p.b64);
  return p;
}
async function loadAll(list,onEach){
  let i=0;const n=list.length;
  const worker=async()=>{while(i<n){const k=i++;try{await loadPhoto(list[k]);}catch(e){list[k].err=e.message;log('  写真を読めません: '+list[k].name+' ('+e.message+')','warn');}if(onEach)onEach();}};
  await Promise.all([worker(),worker(),worker(),worker()]);
}
function numOf(name){
  const m=String(name||'').normalize('NFKC').match(/(\d+)(?!.*\d)/);
  if(m)return parseInt(m[1],10);
  const k=String(name||'').match(/[一二三四五六七八九十]+/);
  return k?kanjiToNum(k[0]):null;
}
function byName(a,b){return String(a.name).localeCompare(String(b.name),undefined,{numeric:true});}

/* ══════════ AI (Opus · TOOL の中で · D9・D11) ══════════ */
async function callAI(content,maxTokens,retry){
  retry=retry||0;
  if(!S.apiKey)throw new Error('AI キーがありません (STEP 1 で保存してください)');
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:MODEL,max_tokens:maxTokens||2000,messages:[{role:'user',content}]})});
  if((r.status===429||r.status===529||r.status>=500)&&retry<4){await new Promise(res=>setTimeout(res,4000*Math.pow(2,retry)));return callAI(content,maxTokens,retry+1);}
  if(!r.ok)throw new Error('AI '+r.status+': '+(await r.text()).slice(0,160));
  const d=await r.json();
  if(d.stop_reason==='max_tokens')throw new Error('AI の答えが途中で切れました');
  return (d.content||[]).map(x=>x.type==='text'?x.text:'').join('');
}
function parseJson(txt){
  const t=String(txt||'').replace(/```json|```/g,'').trim();
  const a=t.indexOf('{'),b=t.indexOf('[');
  const start=(a<0)?b:(b<0?a:Math.min(a,b));
  if(start<0)throw new Error('AI の答えに JSON がありません');
  const open=t[start],close=open==='{'?'}':']';
  const end=t.lastIndexOf(close);
  return JSON.parse(t.slice(start,end+1));
}
function imgBlock(b64){return {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}};}

/* ── 検査書類 (CHECK LIST · PIR) を読む ── */
const DOC_PROMPT=`COTECNA の検査書類 (PDF) です。CHECK LIST & CONTAINER VANNING の表と PHYSICAL INSPECTION REPORT を読み取ってください。手書きでも最善の読み取りで。
- rows は CHECK LIST の No の順。ct はコンテナ番号 (英字4+数字7)、seal は COTECNA Seal No を「JP-数字」の形で、item は Item Name (例 OMG)、checked は Checked 列の数 (0/1 など)、bales は Bales 列の数。
- dates は DATE / Inspection Date に書かれた全部の日を YYYY-MM-DD で (例 05,06/11/2026 → 2026-11-05 と 2026-11-06)。
- total_checked は CHECK LIST 合計行の Checked 合計、pir_checked は PIR の「Total Number of bales checked」。
- inspect_place は CHECK LIST の INSPECTOR PLACE (無ければ PIR の Place of Inspection の 1 行目)。
- 読めない値は null。CHECK LIST が無い書類なら rows は []。
JSON だけを返す:
{"vo":"X.13.099741","partial":"P17","inspect_place":"OOMOTO SHIRYO","dates":["2026-11-05"],"total_checked":13,"pir_checked":13,"total_bales":431,"rows":[{"no":1,"ct":"CMAU8876442","seal":"JP-9054236","item":"OMG","checked":1,"bales":21}]}`;
async function readDoc(item){
  if(S.docCache[item.id])return S.docCache[item.id];
  const blob=await grBlob(item.id);
  const b64=await blobToB64(blob);
  const txt=await callAI([{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},{type:'text',text:DOC_PROMPT}],4000);
  const d=parseJson(txt);
  d.rows=(d.rows||[]).map(r=>({no:r.no,ct:normCt(r.ct),seal:normSeal(r.seal),item:normItem(r.item),checked:toInt(r.checked),bales:toInt(r.bales)}));
  d.file=item.name;
  S.docCache[item.id]=d;
  return d;
}
function toInt(v){if(v==null||v==='')return null;const n=parseInt(String(v).replace(/[^\d-]/g,''),10);return isNaN(n)?null:n;}
function normCt(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function normSeal(s){const d=String(s||'').replace(/\D/g,'');return d?'JP-'+d:'';}
function normItem(s){return String(s||'').toUpperCase().replace(/\s/g,'').replace(/^J(?=[A-Z]{3}$)/,'');}
function normPartial(s){const m=String(s||'').toUpperCase().match(/P\s*0*(\d+)/);return m?'P'+m[1]:String(s||'').toUpperCase().trim();}
function levenshtein(a,b){
  const m=a.length,n=b.length,dp=[];
  for(let i=0;i<=m;i++){dp[i]=[];for(let j=0;j<=n;j++)dp[i][j]=i===0?j:j===0?i:0;}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])dp[i][j]=Math.min(dp[i][j],dp[i-2][j-2]+1);   /* 2 文字の入れ替え (EMCU↔ECMU) も 1 */
  }
  return dp[m][n];
}
/* ISO 6346 チェックディジット */
function ctCheckOk(ct){
  ct=normCt(ct);if(!/^[A-Z]{4}\d{7}$/.test(ct))return false;
  const v={};let n=10;
  for(const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){if(n%11===0)n++;v[ch]=n++;}
  let s=0;for(let i=0;i<10;i++){const c=ct[i];s+=(/\d/.test(c)?+c:v[c])*Math.pow(2,i);}
  return (s%11)%10===+ct[10];
}
/* 書類の CT と COMPASS の CT を対応付ける (完全一致 → 1〜2 文字違いで 1 対 1) */
function matchRows(compassCts,rows){
  const map={},used=new Set();
  rows.forEach(r=>{if(compassCts.includes(r.ct)&&!used.has(r.ct)){map[r.no]=r.ct;used.add(r.ct);}});
  rows.forEach(r=>{
    if(map[r.no])return;
    let best=null,bd=99;
    compassCts.filter(c=>!used.has(c)).forEach(c=>{const d=levenshtein(r.ct,c);if(d<bd){bd=d;best=c;}});
    if(best&&bd<=2){map[r.no]=best;used.add(best);}
  });
  return map;
}
/* この IV × Partial の書類を選ぶ: CT が一番多く重なるもの (同点は Partial 一致を優先) */
function pickDoc(docs,compassCts,partial){
  let best=null,score=-1;
  for(const d of docs){
    const hit=Object.keys(matchRows(compassCts,d.rows||[])).length;
    const sc=hit*10+(normPartial(d.partial)===normPartial(partial)?5:0);
    if(hit>0&&sc>score){score=sc;best=d;}
  }
  return best;
}
/* CT の順番 = 書類の No 順 (D2) · 書類に無い COMPASS CT は最後 */
function orderCts(compassCts,doc){
  if(!doc||!doc.rows||!doc.rows.length)return {order:compassCts.slice(),rowOf:{},notInDoc:compassCts.slice(),docOnly:[]};
  const map=matchRows(compassCts,doc.rows);
  const rows=doc.rows.slice().sort((a,b)=>(a.no||0)-(b.no||0));
  const order=[],rowOf={},docOnly=[];
  rows.forEach(r=>{const c=map[r.no];if(c){if(!order.includes(c)){order.push(c);rowOf[c]=r;}}else docOnly.push(r.ct);});
  const notInDoc=compassCts.filter(c=>!order.includes(c));
  return {order:order.concat(notInDoc),rowOf,notInDoc,docOnly};
}
/* CT の写真フォルダ: _COTECNA/{CT} → {IV}/{CT} → 1 文字違いのフォルダ (D15) */
function resolveCtFolder(ct,cotItems,ivItems){
  if(!/^[A-Z]{4}\d{7}$/.test(ct||''))return null;   /* v15.3: 番号でない値 (空など) で _書類 · _BALING に当たらないように */
  const isF=x=>x&&x.folder&&/^[A-Z]{4}\d{7}$/.test(normCt(x.name));
  const f1=(cotItems||[]).find(x=>isF(x)&&normCt(x.name)===ct);if(f1)return {item:f1,where:'_COTECNA'};
  const f2=(ivItems||[]).find(x=>isF(x)&&normCt(x.name)===ct);if(f2)return {item:f2,where:'IV'};
  const near=[...(cotItems||[]).map(x=>({x,w:'_COTECNA'})),...(ivItems||[]).map(x=>({x,w:'IV'}))]
    .filter(o=>isF(o.x)&&/^[A-Z]{4}\d{7}$/.test(normCt(o.x.name))&&levenshtein(normCt(o.x.name),ct)===1);
  if(near.length===1)return {item:near[0].x,where:near[0].w,note:'フォルダ名 '+near[0].x.name+' を使用 (COMPASS は '+ct+')'};
  return null;
}
/* 検査日の文字 (D6): 写真が届いた日以前で一番近い検査日 · 無ければ最初の検査日 */
function pickInspDate(dates,refYmd){
  const ds=[...new Set((dates||[]).filter(Boolean))].sort();
  if(!ds.length)return '';
  if(refYmd){const le=ds.filter(d=>d<=refYmd);if(le.length)return le[le.length-1];}
  return ds[0];
}
function setYmd(setName){const m=String(setName||'').match(/^(\d{4})(\d{2})(\d{2})/);return m?m[1]+'-'+m[2]+'-'+m[3]:'';}
/* レポートの日付表記 (v14.1 の形 · 月をまたぐ場合も正しく) */
function formatReportDate(dates){
  const MN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const ds=[...new Set((dates||[]).filter(Boolean))].sort();
  if(!ds.length)return '';
  const p=s=>{const [y,m,d]=s.split('-').map(Number);return {y,m,d};};
  const a=p(ds[0]),b=p(ds[ds.length-1]);
  if(ds.length===1)return `${MN[a.m-1]}. ${a.d}, ${a.y}`;
  if(a.y===b.y&&a.m===b.m)return `${MN[a.m-1]}. ${a.d} &amp; ${b.d}, ${a.y}`;
  if(a.y===b.y)return `${MN[a.m-1]}. ${a.d} &amp; ${MN[b.m-1]}. ${b.d}, ${a.y}`;
  return `${MN[a.m-1]}. ${a.d}, ${a.y} &amp; ${MN[b.m-1]}. ${b.d}, ${b.y}`;
}
function boardOk(read,vo,partial){
  if(!read)return null;
  const r=String(read).toUpperCase().replace(/\s/g,'');
  const voDigits=String(vo||'').replace(/\D/g,'');
  const rDigits=(r.match(/X\.?([\d.]+)/)||[])[1]||'';
  const vOk=voDigits&&rDigits.replace(/\D/g,'')===voDigits;
  const pOk=normPartial(partial)===normPartial((r.match(/P\s*0*\d+/)||[''])[0]);
  return vOk&&pOk;
}

/* ── VAN 6 枠 (CT ごとに写真全部を 1 回で · v14.1 の判断基準) ── */
function vanPrompt(ct,seal,vo,partial){
  return `あなたは古紙輸出の COTECNA 検査写真を分類する担当者です。1 本のコンテナ (CT) の写真がすべて番号付きで渡されます。写真どうしを見比べて、次の 6 枠にそれぞれ最も合う写真を 1 枚ずつ選んでください。

【6 枠の基準】
empty: 両扉を開けたコンテナ内部が空。コルゲート(波板)が見える。荷物が少しでも写っていれば empty ではない。
half: 正面(両扉の真ん中)から内部を撮影し、古紙ベールが半分程度(30〜70%)積まれている。左右の内壁が対称に見える。積載写真のうち積載が少ない方。
full: 内部に古紙ベールが天井近くまでぎっしり。積載写真のうち最も多い方。
right_door: 左側または中央に積まれたベール + 右側にコンテナの扉 + コンテナ番号が横書きで正面から読める。内壁を下から見上げた構図・番号が縦書きの写真は不可。両扉とも閉まった外観写真は不可。
inspector: ヘルメット・安全ベストの検査員が、コンテナ(閉じた扉・外観)の前に立っている。検査番号の紙(例「X.13.099741 - P8」)を持っていることが多い。人物が写っていない写真は不可。背景が古紙・倉庫なら BALING の inspector でありこの枠ではない。
cotecna_seal: COTECNA の封印シールのクローズアップ。「COTECNA」の文字(一部でも可)と「JP-」で始まる番号の両方が見えること。黄色くても船会社のシール(会社ロゴ・QRコード・J0022892 のような番号)は不可。候補が複数なら、黄色のタグで COTECNA と JP- 番号が両方はっきり読める方。

【使わない写真】船会社シールだけ、計量票・搬入票など書類、側面だけ、内壁の見上げ、扉だけで荷物も人物も無い外観。
【BALING 写真】この CT の写真に、ヤードのベール全景(goods_yard)、古紙を背景にした検査員(inspector)、開梱したバラ(open_bale)、COTECNA テープで再梱包したベール(rebale)が混ざっていれば baling に入れる。圧縮機(ベーラー)が写っていて中に古紙が散らばって見える写真は open_bale。

【読み取り】
seal_read: cotecna_seal 写真の番号 (JP-0000000 の形)。読めなければ null。
ct_read: right_door 写真のコンテナ番号 (英字4+数字7)。読めなければ null。
board_read: inspector 写真の紙の文字 (例 "X.13.099741-P8")。無ければ null。
has_date: 選んだ各写真に撮影日付の文字が写っているか (true/false)。

参考: この CT は ${ct}、検査書類の COTECNA シール番号は ${seal||'不明'}、検査番号は ${vo||'不明'}-${partial||'不明'}。参考値に合わせて読み替えず、写真に見えるとおりに答えること。
該当写真が無い枠は null。1 枚の写真を 2 つの枠に使わない。
JSON だけを返す:
{"slots":{"empty":1,"half":2,"full":3,"right_door":4,"inspector":5,"cotecna_seal":6},"seal_read":"JP-0000000","ct_read":"ABCD1234567","board_read":"X.13.000000-P1","has_date":{"empty":true,"half":true,"full":true,"right_door":true,"inspector":true,"cotecna_seal":true},"baling":[{"photo":7,"type":"open_bale"}],"note":"一言"}`;
}
async function classifyVan(ctInfo,vo,partial){
  const ph=ctInfo.photos.filter(p=>p.ai);
  if(!ph.length)return null;
  const content=[];
  ph.forEach((p,i)=>{content.push({type:'text',text:`[写真 ${i+1}] ${p.name}${p.hint?' (参考: '+p.hint+')':''}`});content.push(imgBlock(p.ai));});
  content.push({type:'text',text:vanPrompt(ctInfo.ctNo,ctInfo.docSeal,vo,partial)});
  const r=parseJson(await callAI(content,1500));
  const idx=n=>(n==null||isNaN(+n)||+n<1||+n>ph.length)?null:ph[+n-1];
  const slots={};const usedP=new Set();
  SLOT_ORDER.forEach(s=>{const p=idx(r.slots&&r.slots[s]);if(p&&!usedP.has(p)){slots[s]=p;usedP.add(p);}else slots[s]=null;});
  const hasDate={};SLOT_ORDER.forEach(s=>{hasDate[s]=!(r.has_date&&r.has_date[s]===false);});
  const baling=(r.baling||[]).map(b=>({p:idx(b.photo),type:b.type})).filter(b=>b.p&&!usedP.has(b.p)&&['goods_yard','inspector','open_bale','rebale'].includes(b.type));
  return {slots,hasDate,sealRead:normSeal(r.seal_read),ctRead:normCt(r.ct_read),boardRead:r.board_read||'',baling,note:r.note||''};
}

/* ── BALING (判断順: 人物 → 塊 → 散らばり · v14.1 + D5) ── */
function balingPrompt(items){
  return `古紙のベーリング検査写真です。番号付きの各写真を分類してください。
判断の順番 (上から最初に当てはまったもの):
① 人物(検査員)が少しでも写っていれば inspector。
② 古紙ベールの塊が写っている: 倉庫・ヤードに複数段・複数列で並ぶ全景なら goods_yard、塊 1 個が主役なら rebale。針金・紐・テープ・COTECNA ラベルの跡があれば必ず rebale。横倒し・崩れかけ・斜めでも塊の形が残っていれば rebale。迷ったら rebale。
③ 塊の形がまったく無く紙が散らばっているだけ、袋に入っているだけでプレスされていない、または圧縮機(ベーラー)が写っていて中に古紙が散らばって見える写真は open_bale。
④ 書類・計量票・機械だけ・その他は other。
品目(grade)の候補: ${items.length?items.join(' / '):'不明'}。ファイル名・フォルダ名の手がかり(例 OMG, BBC, (OCC))や写真から分かれば入れ、分からなければ null。
has_date: 写真に撮影日付の文字が写っているか。sharp: 写真の鮮明さ 1〜5。
JSON 配列だけを返す:
[{"photo":1,"type":"goods_yard|inspector|open_bale|rebale|other","item":"OMG","has_date":true,"sharp":4}]`;
}
async function classifyBaling(photos,items){
  const ph=photos.filter(p=>p.ai);
  for(let k=0;k<ph.length;k+=BALING_CHUNK){
    const part=ph.slice(k,k+BALING_CHUNK),content=[];
    part.forEach((p,i)=>{content.push({type:'text',text:`[写真 ${i+1}] ${p.setName?p.setName+'/':''}${p.name}${p.hint?' (参考: '+p.hint+')':''}`});content.push(imgBlock(p.ai));});
    content.push({type:'text',text:balingPrompt(items)});
    const arr=parseJson(await callAI(content,Math.min(8000,200+part.length*60)));
    (Array.isArray(arr)?arr:[]).forEach(a=>{const p=part[(+a.photo)-1];if(!p)return;
      p.type=['goods_yard','inspector','open_bale','rebale','other'].includes(a.type)?a.type:'other';
      p.item=normItem(a.item)||p.item||'';p.hasDate=a.has_date!==false;p.sharp=+a.sharp||3;});
  }
}
/* 開梱 ↔ 再梱包 の組 (D3: 検査数ちょうど · D4: 同じ grade) · ファイル名の番号が同じものを先に組む (v14.1 の KANEKO 規則の一般化) */
function pairBales(photos,needByItem){
  const items=Object.keys(needByItem);
  const pairs=[],short={};
  const itemOf=p=>{if(items.length===1)return items[0];return p.item&&items.includes(p.item)?p.item:'';};
  for(const it of items){
    const need=needByItem[it]||0;
    const opens=photos.filter(p=>p.type==='open_bale'&&itemOf(p)===it).sort(byName);
    const rebs=photos.filter(p=>p.type==='rebale'&&itemOf(p)===it).sort(byName);
    const cand=[],uo=new Set(),ur=new Set();
    opens.forEach(o=>{const n=numOf(o.name);if(n==null)return;const r=rebs.find(x=>!ur.has(x)&&x.setName===o.setName&&numOf(x.name)===n);if(r){cand.push({open:o,rebale:r,item:it,num:n});uo.add(o);ur.add(r);}});
    const ro=opens.filter(o=>!uo.has(o)),rr=rebs.filter(r=>!ur.has(r));
    for(let i=0;i<Math.min(ro.length,rr.length);i++)cand.push({open:ro[i],rebale:rr[i],item:it,num:null});
    const take=cand.slice(0,need);
    take.forEach(x=>pairs.push(x));
    if(take.length<need)short[it]=need-take.length;
  }
  return {pairs,short};
}

/* ══════════ 1 件 (IV × Partial) の自動処理 ══════════ */
function addIssue(job,level,text,extra){
  const it=Object.assign({id:'i'+(job.issues.length+1),level,text,ack:false},extra||{});
  job.issues.push(it);log((level==='red'?'  ✖ ':'  △ ')+text,level==='red'?'err':'warn');
  return it;
}
function blocking(job){return job.issues.filter(i=>i.level==='red'&&!i.ack&&!i.hard);}
function uniq(a){return [...new Set(a.filter(Boolean))];}

async function loadSealMaster(){
  if(S.sealMaster)return S.sealMaster;
  try{S.sealMaster=await grJsonPath(SEAL_JSON_PATH)||{records:{}};}catch(e){S.sealMaster={records:{}};log('seal 記録を読めません: '+e.message,'warn');}
  if(!S.sealMaster.records)S.sealMaster.records={};
  return S.sealMaster;
}
/* 営業所の英語名: これまでの seal 記録 (営業所(JP) → 営業所(EN)) から · 無ければ検査書類の INSPECTOR PLACE */
async function plantEnOf(plantJa){
  if(!plantJa)return '';
  const m=await loadSealMaster();
  let best=null;
  Object.values(m.records).forEach(r=>{if(r.plant_jp===plantJa&&r.plant_en&&(!best||(r.saved_at||'')>(best.saved_at||'')))best=r;});
  return best?best.plant_en:'';
}

async function runJob(row){
  const job={row,issues:[],cts:[],doc:null,baling:{photos:[],pairs:[],goods:[],insp:[],short:{},need:null},place:'',state:'run',built:null};
  S.jobs[row.groupKey]=job;renderJob(job);
  log(`■ ${row.ivNo} / ${row.partial||'—'} (${row.voNo||'VO 不明'} · ${row.packer})`,'info');
  const root=photoRoot()+'/'+row.ivNo;
  const ivItems=await grList(root)||[];
  if(!ivItems.length)addIssue(job,'red','PHOTO_V2 に '+row.ivNo+' のフォルダがありません',{hard:true});
  const cot=ivItems.find(x=>x.folder&&x.name==='_COTECNA');
  const cotItems=cot?(await grListItem(cot.id)||[]):[];
  let kinds=null;
  if(cot){try{kinds=await grJsonPath(root+'/_COTECNA/_kinds.json');}catch(e){}}

  /* 1) 検査書類 */
  const docFolder=cotItems.find(x=>x.folder&&x.name==='_書類');
  const docItems=docFolder?(await grListItem(docFolder.id)||[]).filter(x=>/\.pdf$/i.test(x.name)):[];
  const docs=[];
  for(const d of docItems){
    try{log('  検査書類を読む: '+d.name);docs.push(await readDoc(d));}
    catch(e){addIssue(job,'yellow','検査書類を読めません: '+d.name+' ('+e.message+')');}
  }
  if(row.noCtIds&&row.noCtIds.length)addIssue(job,'red',`COMPASS でコンテナ番号が未入力の CT が ${row.noCtIds.length} 件あります (レポートに入りません)`,{kind:'compass'});
  if(!row.ctList.length){addIssue(job,'red','コンテナ番号のある CT がありません — COMPASS の入力を待ってください',{hard:true});job.state='ng';renderJob(job);return;}
  const compassCts=row.ctList.map(c=>c.ctNo);
  const doc=pickDoc(docs,compassCts,row.partial);
  job.doc=doc;
  if(!doc)addIssue(job,'red','この Partial の検査書類 (CHECK LIST) が見つかりません — CT の順番は COMPASS 順、検査数は不明です',{kind:'doc'});
  else log('  書類: '+doc.file+' (CT '+(doc.rows||[]).length+' 行 · 検査数 '+(doc.total_checked??'?')+')');
  const ord=orderCts(compassCts,doc);
  if(doc&&ord.notInDoc.length)addIssue(job,'red','検査書類に無い CT: '+ord.notInDoc.join(', ')+' (レポートでは最後に並べます)',{kind:'order'});
  if(doc&&ord.docOnly.length)addIssue(job,'yellow','検査書類にあって COMPASS (この Partial) に無い CT: '+ord.docOnly.join(', '));
  const docDates=(doc&&doc.dates)||[];

  /* 2) VAN (CT ごと) */
  let k=0;
  for(const ctNo of ord.order){
    k++;setProgress(Math.round(5+70*k/ord.order.length),`${row.ivNo} ${row.partial}: CT ${k}/${ord.order.length} 写真分類`);
    const cinfo=row.ctList.find(c=>c.ctNo===ctNo)||{date:''};
    const r=ord.rowOf[ctNo]||null;
    const c={ctNo,date:cinfo.date||'',docRow:r,docSeal:r&&r.seal||'',photos:[],slots:{},hasDate:{},seal:'',sealSrc:'',reads:{},where:''};
    job.cts.push(c);
    if(docDates.length&&c.date&&!docDates.includes(c.date))addIssue(job,'red',`${ctNo}: COMPASS の作業日 ${c.date} が検査書類の日付 (${docDates.join(', ')}) にありません`,{ct:ctNo,kind:'date'});
    if(!c.date){c.date=pickInspDate(docDates,'');if(!c.date)addIssue(job,'red',ctNo+': 検査日が分かりません (写真の日付を入れられません)',{ct:ctNo,kind:'date'});}
    const f=resolveCtFolder(ctNo,cotItems,ivItems);
    if(!f){addIssue(job,'red',ctNo+': 写真フォルダがありません',{ct:ctNo,kind:'folder'});renderJob(job);continue;}
    c.where=f.where;
    if(f.note)addIssue(job,'yellow',ctNo+': '+f.note,{ct:ctNo});
    const items=(await grListItem(f.item.id)||[]).filter(x=>x.file&&IMG_RE.test(x.name)).sort(byName);
    const kc=kinds&&(kinds.containers||[]).find(x=>normCt(x.ct)===ctNo);
    c.photos=items.map(x=>{const kp=kc&&(kc.photos||[]).find(p=>p.file===x.name);return {id:x.id,name:x.name,thumb:thumbUrl(x),hint:kp&&kp.van_slot?'エンジン推定 '+kp.van_slot:''};});
    await loadAll(c.photos);
    let res=null;
    try{res=await classifyVan(c,row.voNo,row.partial);}catch(e){addIssue(job,'red',ctNo+': AI 分類に失敗 ('+e.message+')',{ct:ctNo,kind:'ai'});}
    if(res){
      c.slots=res.slots;c.hasDate=res.hasDate;c.reads={seal:res.sealRead,ct:res.ctRead,board:res.boardRead,note:res.note};
      res.baling.forEach(b=>{b.p.type=b.type;b.p.setName=ctNo;job.baling.photos.push(b.p);});
    }
    verifyCt(job,c,row);
    renderJob(job);
  }

  /* 3) BALING */
  setProgress(80,`${row.ivNo} ${row.partial}: BALING`);
  await prepareBaling(job,row,cotItems,kinds,docDates);

  /* 4) 検査場所 (営業所の英語名) */
  const en=await plantEnOf(row.plantJa);
  job.place=en?`${row.packer} / ${en}`:(doc&&doc.inspect_place?`${row.packer} / ${doc.inspect_place}`:'');
  if(!job.place)addIssue(job,'red','検査場所 (営業所の英語名) が分かりません — 下の欄に入れてください',{kind:'place'});
  else if(!en)addIssue(job,'yellow','検査場所は検査書類の INSPECTOR PLACE を使いました: '+job.place,{kind:'place'});

  await finishJob(job);
}

/* 照合 (D10: 合っていれば人の確認なし · 合わない枠だけ赤) */
function verifyCt(job,c,row){
  job.issues=job.issues.filter(i=>!(i.ct===c.ctNo&&i.kind==='slot'));
  SLOT_ORDER.forEach(s=>{if(!c.slots[s])addIssue(job,'red',`${c.ctNo}: ${SLOT_JA[s]} の写真がありません`,{ct:c.ctNo,slot:s,kind:'slot'});});
  /* COTECNA seal: 検査書類の番号が正 · 写真の番号と照合 */
  const rd=c.reads.seal||'';
  if(c.docSeal){c.seal=c.docSeal;c.sealSrc='検査書類';
    if(c.slots.cotecna_seal&&rd&&rd!==c.docSeal)addIssue(job,'red',`${c.ctNo}: シール写真の番号 ${rd} が検査書類 ${c.docSeal} と違います`,{ct:c.ctNo,slot:'cotecna_seal',kind:'slot'});
    else if(c.slots.cotecna_seal&&!rd)addIssue(job,'red',`${c.ctNo}: シール写真の番号が読めません (検査書類 ${c.docSeal})`,{ct:c.ctNo,slot:'cotecna_seal',kind:'slot'});
  }else if(rd){c.seal=rd;c.sealSrc='写真';addIssue(job,'yellow',`${c.ctNo}: 検査書類に seal が無いので写真の番号 ${rd} を使います`,{ct:c.ctNo,kind:'slot'});}
  else{c.seal='';c.sealSrc='';addIssue(job,'red',`${c.ctNo}: COTECNA シール番号が分かりません — 番号欄に入れてください`,{ct:c.ctNo,slot:'cotecna_seal',kind:'slot'});}
  /* コンテナ番号 (COMPASS が正 · 写真で正しい扉写真かを確認) */
  if(c.slots.right_door&&c.reads.ct&&c.reads.ct!==c.ctNo&&levenshtein(c.reads.ct,c.ctNo)>1)
    addIssue(job,'red',`${c.ctNo}: 右扉写真の番号 ${c.reads.ct} が COMPASS と違います (別の CT の写真かもしれません)`,{ct:c.ctNo,slot:'right_door',kind:'slot'});
  /* 検査員の紙 (VO-Partial) */
  const b=boardOk(c.reads.board,row.voNo,row.partial);
  if(c.slots.inspector&&b===false)addIssue(job,'red',`${c.ctNo}: 検査員の紙 「${c.reads.board}」 が ${row.voNo}-${row.partial} と違います`,{ct:c.ctNo,slot:'inspector',kind:'slot'});
}

async function prepareBaling(job,row,cotItems,kinds,docDates){
  const B=job.baling,doc=job.doc;
  const bf=cotItems.find(x=>x.folder&&x.name==='_BALING');
  const sets=bf?(await grListItem(bf.id)||[]).filter(x=>x.folder):[];
  const meta=n=>(kinds&&kinds.baling||[]).find(s=>s.set===n)||{};
  let mine=sets.filter(s=>normPartial(meta(s.name).partial)===normPartial(row.partial));
  if(!mine.length){
    const nulls=sets.filter(s=>!meta(s.name).partial);
    if(nulls.length){mine=nulls;addIssue(job,'yellow',`検査番号の付いていない BALING 写真 (${nulls.length} 組) を使いました`);}
  }
  for(const s of mine){
    const m=meta(s.name);
    const list=(await grListItem(s.id)||[]).filter(x=>x.file&&IMG_RE.test(x.name));
    list.forEach(x=>B.photos.push({id:x.id,name:x.name,thumb:thumbUrl(x),setName:s.name,item:'',hint:m.item?'品目 '+m.item:''}));
  }
  /* CT フォルダに混ざっていた BALING 写真 (沖縄紙業など) も含めて全部を同じ基準で分類する */
  const fromSets=B.photos;
  await loadAll(fromSets.filter(p=>!p.b64));
  /* 品目候補 */
  let items=uniq(((doc&&doc.rows)||[]).map(r=>r.item));
  if(!items.length&&kinds){items=uniq((kinds.baling||[]).flatMap(s=>String(s.item||'').split('/').map(normItem)));}
  try{if(fromSets.length)await classifyBaling(fromSets,items);}catch(e){addIssue(job,'red','BALING の AI 分類に失敗 ('+e.message+')',{kind:'baling'});}
  B.photos.filter(p=>p.hasDate==null).forEach(p=>{p.hasDate=true;});
  /* 必要な組の数 (D3) */
  const rows=(doc&&doc.rows)||[];
  const total=doc?(doc.total_checked??doc.pir_checked??null):null;
  const need={};
  if(rows.some(r=>r.checked!=null)){rows.forEach(r=>{if(r.checked)need[r.item||'']=(need[r.item||'']||0)+r.checked;});}
  else if(total!=null){
    if(items.length<=1)need[items[0]||'']=total;
    else{need[items[0]]=total;addIssue(job,'red','品目ごとの検査数が書類から分かりません (合計 '+total+')',{kind:'baling'});}
  }
  const sumRows=Object.values(need).reduce((a,b)=>a+b,0);
  if(doc&&doc.total_checked!=null&&rows.some(r=>r.checked!=null)&&doc.total_checked!==sumRows)addIssue(job,'yellow',`検査数: 合計行 ${doc.total_checked} と各行の合計 ${sumRows} が違います (各行の合計を使います)`);
  if(doc&&doc.pir_checked!=null&&doc.pir_checked!==sumRows&&sumRows)addIssue(job,'yellow',`検査数: PIR ${doc.pir_checked} と CHECK LIST ${sumRows} が違います`);
  let res;
  if(!Object.keys(need).length){
    addIssue(job,'red','検査数 (Checked) が分かりません — 組の数を確かめられません',{kind:'baling'});
    const big={};(items.length?items:['']).forEach(it=>big[it]=999);
    res=pairBales(B.photos,big);res.short={};
  }else res=pairBales(B.photos,need);
  B.need=need;B.pairs=res.pairs;B.short=res.short;
  Object.keys(res.short).forEach(it=>addIssue(job,'red',`開梱・再梱包の組が足りません: ${it||'品目不明'} あと ${res.short[it]} 組 (検査数 ${need[it]}) — BALING レポートは作りません`,{kind:'short',hard:true}));
  /* ヤード全景・検査員 = 各 1 枚 (v14.1 の BALING 様式は 1 組だけ載せる) */
  const nDates=1;
  const best=t=>B.photos.filter(p=>p.type===t).sort((a,b)=>(b.sharp||0)-(a.sharp||0)||byName(a,b)).slice(0,nDates);
  B.goods=best('goods_yard');B.insp=best('inspector');
  if(B.goods.length<nDates)addIssue(job,'red',`ヤード全景 (Goods at Yard) が ${nDates} 枚必要ですが ${B.goods.length} 枚です`,{kind:'baling'});
  if(B.insp.length<nDates)addIssue(job,'red',`古紙の前の検査員 (Inspector with Goods) が ${nDates} 枚必要ですが ${B.insp.length} 枚です`,{kind:'baling'});
  /* 検査日 (D6 · v15.1): 開梱・再梱包の組 = その組を検査した CT の作業日。
     CHECK LIST の No 順に、各 CT の Checked の数だけ その CT の作業日 (COMPASS) を割り当てる。
     作業が 2 日にわたる場合 (例 16 日・17 日) も CT ごとの正しい日になる (v15.0 は全部を写真の届いた日で決めていた)。
     ヤード全景・検査員 = 最初の検査日。 */
  const dates=uniq(row.workDates.concat(docDates)).sort();
  const seqByItem={};
  rows.slice().sort((a,b)=>(a.no||0)-(b.no||0)).forEach(r=>{
    const c=job.cts.find(x=>x.docRow===r);
    for(let i=0;i<(r.checked||0);i++)(seqByItem[r.item||'']=seqByItem[r.item||'']||[]).push((c&&c.date)||'');
  });
  const usedN={};
  B.pairs.forEach(x=>{
    const it=x.item||'',k=usedN[it]||0;usedN[it]=k+1;
    const seq=seqByItem[it]||[];
    x.date=seq[k]||pickInspDate(dates,setYmd(x.open.setName));
  });
  B.goods.concat(B.insp).forEach(p=>{p.date=dates[0]||'';});
  if(B.pairs.some(x=>!x.date)||B.goods.concat(B.insp).some(p=>!p.date))addIssue(job,'red','BALING 写真の検査日が分かりません',{kind:'date'});
}

async function finishJob(job){
  job.state=blocking(job).length?'ng':'ok';
  renderJob(job);
  if(job.state==='ok')await buildReports(job);
}

function jobId(job){return 'job_'+job.row.groupKey.replace(/[^A-Za-z0-9]/g,'_');}
function imgSrc(p){return p?(p.thumb||(p.ai?'data:image/jpeg;base64,'+p.ai:'')):'';}
function renderJob(job){
  const wrap=document.getElementById('jobs');
  let el=document.getElementById(jobId(job));
  if(!el){el=document.createElement('div');el.id=jobId(job);wrap.appendChild(el);}
  const r=job.row,bl=blocking(job),hard=job.issues.filter(i=>i.hard);
  const stateTxt=job.state==='run'?'処理中…':(bl.length?`確認 ${bl.length} 件`:(hard.length?'一部作成':'自動完了'));
  const stCls=job.state==='run'?'run':(bl.length||hard.length?'ng':'ok');
  el.className='job '+(job.state==='run'?'':stCls);
  let h=`<div class="job-hdr"><b>${esc(r.ivNo)} / ${esc(r.partial||'—')}</b><span class="job-sub">${esc(r.voNo||'VO 不明')} · ${esc(r.packer)} ${esc(r.plantJa)} · CT ${r.ctList.length} · ${esc(r.workDates.join(', '))}</span><span class="job-state ${stCls}">${stateTxt}</span></div><div class="job-body">`;
  if(job.issues.length){
    h+='<ul class="issues">'+job.issues.map(i=>{
      const cls=i.ack?'done':i.level;
      const btn=(i.level==='red'&&!i.hard&&!i.ack&&job.state!=='run')?` <button class="btn btn-ghost btn-sm" onclick="ackIssue('${esc(r.groupKey)}','${i.id}')">確認した (このまま)</button>`:'';
      return `<li class="${cls}">${i.level==='red'?'●':'▲'} ${esc(i.text)}${btn}</li>`;}).join('')+'</ul>';
  }
  if(job.state!=='run'){
    h+=`<div class="filter-bar"><label>検査場所</label><input class="inp" style="width:280px;" value="${esc(job.place)}" onchange="setPlace('${esc(r.groupKey)}',this.value)" aria-label="検査場所"></div>`;
  }
  job.cts.forEach((c,ci)=>{
    h+=`<div class="ct-block"><div class="ct-title">${ci+1}. ${esc(c.ctNo)} <small>${esc(c.date)} · 写真 ${c.photos.length} 枚 (${esc(c.where||'—')})</small>
      <small>COTECNA SEAL</small><input class="inp" style="width:120px;" value="${esc(c.seal)}" onchange="setSeal('${esc(r.groupKey)}',${ci},this.value)" aria-label="${esc(c.ctNo)} COTECNA シール番号">
      <small>${esc(c.sealSrc)}${c.reads&&c.reads.seal?' · 写真 '+esc(c.reads.seal):''}${c.reads&&c.reads.board?' · 紙 '+esc(c.reads.board):''}</small></div><div class="slot-grid">`;
    SLOT_ORDER.forEach(s=>{
      const p=c.slots[s];
      const bad=job.issues.some(i=>i.ct===c.ctNo&&i.slot===s&&i.level==='red'&&!i.ack);
      h+=`<div class="slot ${p?(bad?'red':'ok'):'red'}" tabindex="0" role="button" aria-label="${esc(c.ctNo)} ${SLOT_JA[s]} を選び直す" onclick="openPicker('${esc(r.groupKey)}',${ci},'${s}')" onkeydown="if(event.key==='Enter')openPicker('${esc(r.groupKey)}',${ci},'${s}')">
        ${p?`<img src="${imgSrc(p)}" alt="${esc(SLOT_JA[s])}">`:'<div class="none">なし</div>'}<div class="cap">${SLOT_JA[s]}${p?' · '+esc(p.name):''}</div></div>`;
    });
    h+='</div></div>';
  });
  const B=job.baling;
  if(job.state!=='run'&&(B.photos.length||Object.keys(B.need||{}).length)){
    const needTxt=Object.keys(B.need||{}).map(k=>(k||'品目不明')+' '+B.need[k]).join(' · ')||'不明';
    h+=`<div class="ct-block"><div class="ct-title">BALING <small>写真 ${B.photos.length} 枚 · 検査数 ${esc(needTxt)} · 組 ${B.pairs.length} · 全景 ${B.goods.length} · 検査員 ${B.insp.length}</small></div><div class="pair-grid">`;
    B.goods.forEach(p=>{h+=`<div class="pair"><div class="imgs"><img src="${imgSrc(p)}" alt="Goods at Yard"></div><div class="cap">Goods at Yard · ${esc(p.date)}</div></div>`;});
    B.insp.forEach(p=>{h+=`<div class="pair"><div class="imgs"><img src="${imgSrc(p)}" alt="Inspector with Goods"></div><div class="cap">Inspector · ${esc(p.date)}</div></div>`;});
    B.pairs.forEach((x,i)=>{h+=`<div class="pair"><div class="imgs"><img src="${imgSrc(x.open)}" alt="Open bale ${i+1}"><img src="${imgSrc(x.rebale)}" alt="Re-bale ${i+1}"></div><div class="cap">#${i+1} ${esc(x.item||'')} · ${esc(x.date||'')}</div></div>`;});
    h+='</div></div>';
  }
  if(job.state!=='run'){
    h+=`<div class="mt12" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">`;
    if(!bl.length)h+=`<button class="btn btn-ok btn-sm" onclick="buildReports(S.jobs['${esc(r.groupKey)}'])">レポートを作り直す</button>`;
    else h+=`<span class="hint" style="margin:0;">赤の項目を直すか「確認した」を押すとレポートを作ります</span>`;
    if(job.built)h+=job.built.map(d=>`<a class="dl-btn" href="${d.url}" download="${esc(d.name)}"><span><span class="dl-name">${esc(d.label)}</span><span class="dl-size">${(d.size/1024).toFixed(0)} KB · ${esc(d.name)}</span></span></a>`).join('');
    h+='</div>';
  }
  h+='</div>';
  el.innerHTML=h;
}
function jobOf(key){return S.jobs[key];}
function ackIssue(key,id){const j=jobOf(key);const i=j.issues.find(x=>x.id===id);if(i)i.ack=true;afterEdit(j);}
function setPlace(key,v){const j=jobOf(key);j.place=v.trim();j.issues.filter(i=>i.kind==='place'&&i.level==='red').forEach(i=>{if(j.place)i.ack=true;});afterEdit(j);}
function setSeal(key,ci,v){
  const j=jobOf(key),c=j.cts[ci];c.seal=normSeal(v);c.sealSrc='手入力';
  j.issues.filter(i=>i.ct===c.ctNo&&i.slot==='cotecna_seal'&&i.level==='red').forEach(i=>{if(c.seal)i.ack=true;});afterEdit(j);

let PK=null;
function openPicker(key,ci,slot){
  const j=jobOf(key);if(!j||j.state==='run')return;
  const c=j.cts[ci];PK={key,ci,slot,last:document.activeElement};
  document.getElementById('pickerTitle').textContent=`${c.ctNo} · ${SLOT_JA[slot]} の写真を選ぶ`;

}
function closePicker(){document.getElementById('picker').classList.remove('on');if(PK&&PK.last&&PK.last.focus)PK.last.focus();PK=null;}
function pickPhoto(i){
  if(!PK)return;
  const j=jobOf(PK.key),c=j.cts[PK.ci],p=c.photos[i];
  SLOT_ORDER.forEach(s=>{if(c.slots[s]===p)c.slots[s]=null;});
  c.slots[PK.slot]=p;c.hasDate[PK.slot]=true;
  j.issues.filter(x=>x.ct===c.ctNo&&x.slot===PK.slot&&x.level==='red').forEach(x=>x.ack=true);
  SLOT_ORDER.forEach(s=>{if(!c.slots[s]&&!j.issues.some(x=>x.ct===c.ctNo&&x.slot===s&&!x.ack))addIssue(j,'red',`${c.ctNo}: ${SLOT_JA[s]} の写真がありません`,{ct:c.ctNo,slot:s,kind:'slot'});});
  closePicker();afterEdit(j);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&PK)closePicker();});

/* ══════════ レポート作成 (VAN · BALING · D16) ══════════ */
async function finalB64(p,date,hasDate){
  await loadPhoto(p);
  if(hasDate!==false||!date)return p.b64;
  p.stamped=p.stamped||{};
  if(!p.stamped[date])p.stamped[date]=await stampDate(p.b64,date);
  return p.stamped[date];
}
async function buildReports(job){
  if(!job||blocking(job).length)return;
  try{
    const r=job.row;
    S.voNo=r.voNo&&r.partial?`${r.voNo}-${r.partial}`:(r.voNo||'');
    S.reportDate=formatReportDate(r.workDates);
    S.inspLocation=job.place||'';
    S.containers=[];S.classifiedVan={};
    let no=0;
    for(const c of job.cts){
      no++;S.containers.push({no,container:c.ctNo,seal:c.seal,date:c.date});
      const cl={};
      for(const s of SLOT_ORDER){const p=c.slots[s];if(p)cl[s]=await finalB64(p,c.date,c.hasDate[s]);}
      S.classifiedVan[no]=cl;
    }
    const out=[];
    const name=(S.voNo||(r.ivNo+'_'+r.partial)).replace(/[^A-Za-z0-9._-]/g,'_');
    const van=buildVanDocx();
    out.push({buf:van,name:name+'_VAN.docx',label:'VAN'});
    const B=job.baling;
    if(!Object.keys(B.short||{}).length&&B.pairs.length){
      const pairs=[];
      for(const x of B.pairs)pairs.push({open:await finalB64(x.open,x.date,x.open.hasDate),rebale:await finalB64(x.rebale,x.date,x.rebale.hasDate)});
      const g=[],ins=[];
      for(const p of B.goods)g.push(await finalB64(p,p.date,p.hasDate));
      for(const p of B.insp)ins.push(await finalB64(p,p.date,p.hasDate));
      S.classifiedBaling={goods_yards:g,inspectors:ins,pairs,rebales:[],open_bales:[]};
      out.push({buf:buildBalingDocx(),name:name+'_BALING.docx',label:'BALING'});
    }
    (job.built||[]).forEach(d=>{try{URL.revokeObjectURL(d.url);}catch(e){}});
    job.built=out.map(d=>({name:d.name,label:d.label,size:d.buf.length,url:URL.createObjectURL(new Blob([d.buf],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}))}));
    log(`  ✅ ${r.ivNo}/${r.partial}: ${out.map(d=>d.name).join(' · ')}`,'ok');
    renderJob(job);
    await saveSealRecords(job);
  }catch(e){log('レポート作成エラー: '+e.message,'err');LEENAI.toast('レポート作成エラー: '+e.message,'error');}
}

async function proceedSelected(){
  if(!S.selectedKeys.length)return;
  const k=document.getElementById('apiKey').value.trim();if(k)S.apiKey=k;
  if(!S.apiKey){alert('AI キーを入れて保存してください');return;}
  const miss=commonMissing();if(miss.length){alert('共通ファイルが古いため使えません: '+miss.join(', '));return;}
  const btn=document.getElementById('proceedBtn');btn.disabled=true;
  const s2=document.getElementById('step2');s2.classList.add('active','open');s2.scrollIntoView({behavior:'smooth'});
  document.getElementById('jobs').innerHTML='';
  const rows=S.selectedKeys.map(k=>S.inspList.find(r=>r.groupKey===k)).filter(Boolean);
  for(const row of rows){
    try{await runJob(row);}
    catch(e){const j=S.jobs[row.groupKey];if(j){addIssue(j,'red','処理エラー: '+e.message,{hard:true});j.state='ng';renderJob(j);}log('処理エラー: '+e.message,'err');}
  }
  const done=rows.filter(r=>S.jobs[r.groupKey]&&S.jobs[r.groupKey].state==='ok').length;
  setProgress(100,`完了: 自動 ${done} 件 / 確認が必要 ${rows.length-done} 件`);
  btn.disabled=false;
}

  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;

  return makeZipStore([
